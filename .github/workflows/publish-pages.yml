name: Publish GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish docs to gh-pages
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/direito-constitucional-pages
          git fetch origin gh-pages || true

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add /tmp/direito-constitucional-pages origin/gh-pages
          else
            git worktree add --detach /tmp/direito-constitucional-pages
            git -C /tmp/direito-constitucional-pages checkout --orphan gh-pages
          fi

          find /tmp/direito-constitucional-pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R docs/. /tmp/direito-constitucional-pages/
          touch /tmp/direito-constitucional-pages/.nojekyll

          cd /tmp/direito-constitucional-pages
          git add -A

          if git diff --cached --quiet; then
            echo "No Pages changes to publish."
            exit 0
          fi

          git commit -m "Deploy docs to GitHub Pages"
          git push origin HEAD:gh-pages
